#
# Integration suites: C++ unit tests, crash/fault/race suites against the loadable extension
# (test hooks compiled in), and the S3 suites against a disposable pinned MinIO container.
#
name: Integration
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GEN: ninja
  VCPKG_INSTALL_OPTIONS: --clean-after-build

jobs:
  # Static checks of the agent skill and its manifests, once and independent of the builds. Its own
  # job, so the Python set up here does not change the one the integration suites run with.
  skill:
    name: Agent skill
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out the extension-ci-tools makefiles
        run: git submodule update --init --depth 1 extension-ci-tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate skill files and manifests (static only)
        run: |
          python3 -m pip install -r scripts/requirements-skill.txt
          make check_skill

  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux_amd64
            runner: ubuntu-24.04
            triplet: x64-linux-release
            minio: true
          - name: osx_arm64
            runner: macos-14
            triplet: arm64-osx-release
            minio: false
    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # DuckDB derives its version from the submodule's release tag and commit hash, but the checkout
      # above is shallow and has no tags (the CLI would report v0.0.1). Fetch only the tag of the
      # pinned commit, and abbreviate hashes to 10 digits as DuckDB's own builds do. A pre-release
      # commit without a tag names its version through OVERRIDE_GIT_DESCRIBE (Makefile) instead.
      - name: Fetch the DuckDB version tag
        run: |
          set -euo pipefail
          head=$(git -C duckdb rev-parse HEAD)
          tag=$(git -C duckdb ls-remote --tags origin | awk -v h="$head" '$1==h {sub("refs/tags/","",$2); sub(/\^\{\}$/,"",$2); print $2; exit}')
          if [ -z "$tag" ]; then
            grep -q '^OVERRIDE_GIT_DESCRIBE ?= v' Makefile || { echo "The duckdb submodule commit $head carries no release tag and the Makefile names no version" >&2; exit 1; }
            exit 0
          fi
          git -C duckdb fetch --depth=1 --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git -C duckdb config core.abbrev 10
          git -C duckdb describe --tags --long

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config zip unzip tar curl

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Set up vcpkg
        run: |
          make vcpkg
          echo "VCPKG_TOOLCHAIN_PATH=$PWD/build/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: Build (integration)
        run: make integration

      - name: Unit and integration suites
        run: make test_integration

      - name: Upstream harness checks
        run: make test_upstream_harness

      - name: Upstream native comparison (PR)
        run: make test_upstream_pr

      - name: S3 suites (MinIO)
        if: matrix.minio
        run: |
          docker pull ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
          make test_minio

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.name }}
          path: build/evidence/
          retention-days: 14
